<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZPIX Editor - Online Picture Editor & Resizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --workspace-bg: #030712;
        }

        [data-theme="light"] {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #f3f4f6;
            --bg-panel: #ffffff;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --workspace-bg: #e5e7eb;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            max-width: 100%;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem;
            color: #818cf8;
            font-weight: 700;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px - 55px);
            overflow: hidden;
            flex-direction: row;
            width: 100%;
        }

        sidebar {
            width: 340px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem;
            gap: 1.25rem;
            max-height: 100%;
            flex-shrink: 0;
        }

        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--workspace-bg);
            position: relative;
            overflow: auto;
            padding: 2rem;
            width: 100%;
        }

        .canvas-wrapper {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2);
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            display: block;
            background-image: linear-gradient(45deg, var(--border) 25%, transparent 25%), 
                              linear-gradient(-45deg, var(--border) 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, var(--border) 75%), 
                              linear-gradient(-45deg, transparent 75%, var(--border) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            width: 100%;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover { background-color: var(--border); }

        input[type="file"] { display: none; }

        .file-upload-label {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .file-upload-label:hover { background-color: var(--primary-hover); }

        .dimension-inputs { display: flex; gap: 0.5rem; width: 100%; }
        .dimension-inputs input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 0;
        }
        
        .aspect-ratios {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            width: 100%;
        }
        .aspect-btn {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }
        .aspect-btn:hover { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); }
        .aspect-btn.active-ratio { background: var(--primary); border-color: var(--primary); color: white; }

        .placeholder-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 1rem;
        }

        hr { border: none; border-top: 1px solid var(--border); width: 100%; }

        .stepper-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            width: 100%;
        }
        .stepper-btn {
            background: var(--border);
            color: var(--text-main);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .stepper-btn:hover { background: var(--primary); color: white; }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
        }
        .preset-chip {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .preset-chip:hover { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); }

        footer {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
            z-index: 10;
            gap: 2px;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Floating Widgets Container (Right-Center) */
        .social-float-container {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .social-float {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .social-float svg, .social-float span {
            width: 22px;
            height: 22px;
            fill: currentColor;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Theme Toggle Button Styles */
        .theme-toggle-float {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .theme-toggle-float:hover {
            transform: scale(1.1);
        }

        /* WhatsApp Styles */
        .whatsapp-float {
            background-color: #064e3b;
            color: #ffffff;
        }
        .whatsapp-float:hover {
            background-color: #065f46;
            transform: scale(1.1);
        }

        /* Telegram Styles */
        .telegram-float {
            background-color: #0088cc;
            color: #ffffff;
        }
        .telegram-float:hover {
            background-color: #0099e6;
            transform: scale(1.1);
        }

        @media (max-width: 899px) {
            header { padding: 0.5rem 1rem; }
            header h1 { font-size: 1.1rem; }
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
                width: 100%;
            }
            .workspace {
                order: 1;
                min-height: 250px;
                padding: 1rem;
                border-bottom: 1px solid var(--border);
                width: 100%;
            }
            canvas { max-height: 40vh; }
            sidebar {
                order: 2;
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: none;
                overflow-y: visible;
                padding: 1rem;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ZPIX Editor</h1>
        <button id="downloadBtnTop" class="btn" style="display:none;">Download</button>
    </header>

    <div class="main-container">
        <!-- Workspace -->
        <div class="workspace">
            <div class="placeholder-container" id="placeholderContainer">
                <label for="imageUpload" class="file-upload-label">Browse Image File</label>
                <div class="placeholder-text" id="placeholder">
                    Your picture will show here after you upload it.<br><br>
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Let us do some magic ✨</span>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
        </div>

        <!-- Sidebar controls -->
        <sidebar>
            <input type="file" id="imageUpload" accept="image/*">

            <div class="control-group">
                <label>Resize</label>
                <div class="dimension-inputs">
                    <input type="number" id="widthInput" placeholder="Width">
                    <input type="number" id="heightInput" placeholder="Height">
                </div>
                <div class="aspect-ratios">
                    <button class="aspect-btn active-ratio" onclick="setAspect('free', event)">Free</button>
                    <button class="aspect-btn" onclick="setAspect('1:1', event)">1:1</button>
                    <button class="aspect-btn" onclick="setAspect('4:3', event)">4:3</button>
                    <button class="aspect-btn" onclick="setAspect('16:9', event)">16:9</button>
                </div>
                <button id="resizeBtn" class="btn btn-secondary" style="margin-top: 0.4rem; width: 100%;">Apply Size</button>
            </div>

            <hr>

            <!-- Brightness Stepper -->
            <div class="control-group">
                <label>Brightness: <span id="brightnessVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('brightnessRange', -5)">-</button>
                    <input type="range" id="brightnessRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('brightnessRange', 5)">+</button>
                </div>
            </div>

            <!-- Contrast Stepper -->
            <div class="control-group">
                <label>Contrast: <span id="contrastVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('contrastRange', -5)">-</button>
                    <input type="range" id="contrastRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('contrastRange', 5)">+</button>
                </div>
            </div>

            <!-- Saturation Stepper -->
            <div class="control-group">
                <label>Saturation: <span id="saturationVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('saturationRange', -5)">-</button>
                    <input type="range" id="saturationRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('saturationRange', 5)">+</button>
                </div>
            </div>

            <hr>

            <!-- Filter Presets -->
            <div class="control-group">
                <label>Filter Presets</label>
                <div class="presets-grid">
                    <button class="preset-chip" onclick="applyPreset('normal')">Normal</button>
                    <button class="preset-chip" onclick="applyPreset('vintage')">Vintage</button>
                    <button class="preset-chip" onclick="applyPreset('warm')">Warm</button>
                    <button class="preset-chip" onclick="applyPreset('cool')">Cool</button>
                    <button class="preset-chip" onclick="applyPreset('bw')">B & W</button>
                    <button class="preset-chip" onclick="applyPreset('vivid')">Vivid</button>
                    <button class="preset-chip" onclick="applyPreset('dramatic')">Dramatic</button>
                </div>
            </div>

            <hr>

            <div class="control-group">
                <label>Transform</label>
                <div style="display: flex; gap: 0.5rem; width:100%;">
                    <button id="rotateBtn" class="btn btn-secondary" style="flex:1;">Rotate 90°</button>
                    <button id="flipHBtn" class="btn btn-secondary" style="flex:1;">Flip H</button>
                </div>
            </div>

            <button id="resetBtn" class="btn btn-secondary" style="margin-top: 0.5rem; width:100%;">Reset All Changes</button>
        </sidebar>
    </div>

    <footer>
        <div>ZPIX Editor || All rights reserved</div>
        <div>Powered by <a href="https://lisotech.org" target="_blank">LISOTECH</a></div>
    </footer>

    <!-- Floating Right-Center Social & Theme Icons Container -->
    <div class="social-float-container">
        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="social-float theme-toggle-float" title="Toggle Light/Dark Mode">
            <span id="themeIcon">🌙</span>
        </button>
        <!-- WhatsApp Icon -->
        <a href="https://wa.me/260974101130" class="social-float whatsapp-float" target="_blank" title="Chat on WhatsApp">

            </svg>
        </a>
        <!-- Telegram Icon -->
        <a href="https://t.me/+260974101130" class="social-float telegram-float" target="_blank" title="Chat on Telegram">
            <svg viewBox="0 0 24 24">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.26.26-.534.26l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.195 1.006.131.832.943z"/>
            </svg>
        </a>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholderContainer = document.getElementById('placeholderContainer');
        
        const downloadBtnTop = document.getElementById('downloadBtnTop');

        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const resizeBtn = document.getElementById('resizeBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const flipHBtn = document.getElementById('flipHBtn');

        const brightnessRange = document.getElementById('brightnessRange');
        const contrastRange = document.getElementById('contrastRange');
        const saturationRange = document.getElementById('saturationRange');
        const resetBtn = document.getElementById('resetBtn');

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        let img = new Image();
        let originalWidth = 0;
        let originalHeight = 0;
        let rotationAngle = 0;
        let isFlippedH = false;
        let currentAspect = 'free';

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.getAttribute('data-theme') === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.innerText = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.innerText = '☀️';
            }
        });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function(event) {
                img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;
                    
                    resetFilters();
                    rotationAngle = 0;
                    isFlippedH = false;

                    drawImageToCanvas();
                    
                    canvas.style.display = 'block';
                    placeholderContainer.style.display = 'none';
                    
                    downloadBtnTop.style.display = 'inline-flex';
                }
            }
        });

        function setAspect(ratio, event) {
            currentAspect = ratio;
            document.querySelectorAll('.aspect-btn').forEach(btn => btn.classList.remove('active-ratio'));
            event.target.classList.add('active-ratio');
            if (!img.src) return;

            let curW = parseInt(widthInput.value) || originalWidth;
            let curH = parseInt(heightInput.value) || originalHeight;

            if (ratio === '1:1') {
                let size = Math.min(curW, curH);
                widthInput.value = size;
                heightInput.value = size;
            } else if (ratio === '4:3') {
                heightInput.value = Math.round((curW * 3) / 4);
            } else if (ratio === '16:9') {
                heightInput.value = Math.round((curW * 9) / 16);
            }
            drawImageToCanvas();
        }

        function drawImageToCanvas() {
            let w = parseInt(widthInput.value) || originalWidth;
            let h = parseInt(heightInput.value) || originalHeight;

            if (rotationAngle === 90 || rotationAngle === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(canvas.width / 2, canvas.height / 2);
            if (rotationAngle) ctx.rotate((rotationAngle * Math.PI) / 180);
            if (isFlippedH) ctx.scale(-1, 1);

            ctx.filter = `
                brightness(${brightnessRange.value}%) 
                contrast(${contrastRange.value}%) 
                saturate(${saturationRange.value}%)
            `;

            let drawWidth = rotationAngle === 90 || rotationAngle === 270 ? h : w;
            let drawHeight = rotationAngle === 90 || rotationAngle === 270 ? w : h;

            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.restore();
        }

        function adjustValue(elementId, amount) {
            const el = document.getElementById(elementId);
            let newVal = parseInt(el.value) + amount;
            let min = parseInt(el.min) || 0;
            let max = parseInt(el.max) || 200;
            if (newVal < min) newVal = min;
            if (newVal > max) newVal = max;
            el.value = newVal;
            updateFilterLabelsAndCanvas();
        }

        function updateFilterLabelsAndCanvas() {
            document.getElementById('brightnessVal').innerText = brightnessRange.value + '%';
            document.getElementById('contrastVal').innerText = contrastRange.value + '%';
            document.getElementById('saturationVal').innerText = saturationRange.value + '%';
            drawImageToCanvas();
        }

        [brightnessRange, contrastRange, saturationRange].forEach(input => {
            input.addEventListener('input', updateFilterLabelsAndCanvas);
        });

        function applyPreset(type) {
            if (!img.src) return;
            switch(type) {
                case 'vintage':
                    brightnessRange.value = 110;
                    contrastRange.value = 90;
                    saturationRange.value = 60;
                    break;
                case 'warm':
                    brightnessRange.value = 105;
                    contrastRange.value = 110;
                    saturationRange.value = 130;
                    break;
                case 'cool':
                    brightnessRange.value = 95;
                    contrastRange.value = 120;
                    saturationRange.value = 80;
                    break;
                case 'bw':
                    brightnessRange.value = 100;
                    contrastRange.value = 140;
                    saturationRange.value = 0;
                    break;
                case 'vivid':
                    brightnessRange.value = 105;
                    contrastRange.value = 130;
                    saturationRange.value = 170;
                    break;
                case 'dramatic':
                    brightnessRange.value = 90;
                    contrastRange.value = 160;
                    saturationRange.value = 110;
                    break;
                case 'normal':
                default:
                    resetFilters();
                    break;
            }
            updateFilterLabelsAndCanvas();
        }

        resizeBtn.addEventListener('click', () => drawImageToCanvas());
        rotateBtn.addEventListener('click', () => {
            rotationAngle = (rotationAngle + 90) % 360;
            drawImageToCanvas();
        });
        flipHBtn.addEventListener('click', () => {
            isFlippedH = !isFlippedH;
            drawImageToCanvas();
        });

        function resetFilters() {
            brightnessRange.value = 100;
            contrastRange.value = 100;
            saturationRange.value = 100;
            updateFilterLabelsAndCanvas();
        }

        resetBtn.addEventListener('click', () => {
            if (!img.src) return;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            rotationAngle = 0;
            isFlippedH = false;
            resetFilters();
            drawImageToCanvas();
        });

        downloadBtnTop.addEventListener('click', () => {
            const randomNumber = Math.floor(10000 + Math.random() * 90000);
            const link = document.createElement('a');
            link.download = `ELIs${randomNumber}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
